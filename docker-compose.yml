# MIGRATION WARNING (vibe-tool: do NOT auto-migrate data): current compose uses
# service `db` + DB prototype_rip/trainee + volume postgres_data. Target uses
# `postgres` + rip/rip + volume pgdata. Steps: `docker compose down`,
# `copy .env.example .env` (update OLLAMA_BASE_URL + BGE paths), then
# `docker compose up --build postgres`. Old volume orphaned by design.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      # redis: optional (runs are Postgres-backed, Redis only for queue/cache if needed)
    env_file: ./.env
    environment:
      DB_HOST: postgres
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-rip}
      POSTGRES_USER: ${DB_USER:-rip}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rippass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rip}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # redis: optional
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"

volumes:
  pgdata:
