[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rip-prototype"
version = "0.1.0"
description = "Open-source local NotebookLM RAG Chatbot Assistant"
readme = "Readme.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "psycopg2-binary>=2.9.12",
    "pgvector>=0.4.2",
    "docling>=2.81.0",
    "sentence-transformers>=5.2.3",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "backend/tests",
]
asyncio_mode = "auto"
