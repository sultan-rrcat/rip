[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rip"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    # Core
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    # Database
    "psycopg2-binary>=2.9.12",
    "pgvector>=0.4.2",
    # RAG pipeline (kept from RIP)
    "docling>=2.81.0",
    "sentence-transformers>=5.2.3",
    "langchain-opendataloader-pdf>=2.0.0",  # pipeline.py PDF→markdown loader
    "langchain-text-splitters>=1.1.2",  # pipeline.py MarkdownHeaderTextSplitter
    "langchain-community>=0.4.2",  # pipeline.py HuggingFaceEmbeddings
    "langchain-core>=1.5.5",  # orchestration graph + documents
    # Orchestration (from Athena requirements.txt)
    "langgraph>=1.1.6",
    "langfuse>=4.14.5",  # optional at runtime (langfuse_enabled=false = no-op), required for import
    # HTTP (Ollama provider needs trust_env=False; see ollama.py)
    "httpx>=0.28.1",
    # Config
    "pyyaml>=6.0",
    # Tools (doc.generate pipeline, Athena ADR-026)
    "python-docx>=1.1.0",
    "reportlab>=4.0",
]
# Dropped: google-genai (Gemini removed), neo4j (graph removed).
# Dev: ruff, pytest (backend/tests/). No mypy gate for vibe sessions (ruff + pytest only).

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "backend/tests",
]
asyncio_mode = "auto"
